I2CAddress=0x27
PWM=0
PWMPin=0
PWMBright=100
PWMDim=40
DisplayClock=0
UTC=0
# Pins 100..107 map to the PCF8574 outputs P0..P7
Pins=100,101,102,104,105,106

[OLED]
# 2 = Adafruit I2C 128x32, 3 = Adafruit I2C 128x64 (SSD1306)
